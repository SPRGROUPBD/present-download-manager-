name: Build Android APK and Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: flutter create --platforms=android .
      - name: Set Android compile SDK to 36 for Start.io
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle_file = next((p for p in candidates if p.exists()), None)
          if gradle_file is None:
              raise SystemExit("Android app Gradle file not found")

          content = gradle_file.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 36",
              content,
          )
          if count == 0:
              updated, count = re.subn(
                  r"compileSdkVersion\s+flutter\.compileSdkVersion",
                  "compileSdkVersion 36",
                  content,
              )
          if count == 0:
              if re.search(r"compileSdk\s*=\s*36|compileSdkVersion\s+36", content):
                  print("Android compile SDK is already 36")
              else:
                  raise SystemExit("Could not safely update Android compileSdk")
          else:
              gradle_file.write_text(updated, encoding="utf-8")
              print(f"Set {gradle_file} compileSdk to 36")
          PY
      - name: Ensure Android Internet permission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in content:
              manifest_start = content.find("<manifest")
              tag_end = content.find(">", manifest_start)
              if manifest_start < 0 or tag_end < 0:
                  raise SystemExit("Could not locate the opening manifest tag")
              content = content[:tag_end + 1] + chr(10) + permission + content[tag_end + 1:]
              manifest.write_text(content, encoding="utf-8")

          startio_meta = """    <meta-data
              android:name="com.startapp.sdk.APPLICATION_ID"
              android:value="209491822" />"""
          if "com.startapp.sdk.APPLICATION_ID" not in content:
              content = content.replace("</application>", startio_meta + "\n    </application>")
              manifest.write_text(content, encoding="utf-8")

          print("Android INTERNET permission and Start.io App ID configured")
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Set Start.io Android library compile SDK to 36
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          candidates = list(pub_cache.glob("startapp_sdk-*/android/build.gradle")) + list(pub_cache.glob("startapp_sdk-*/android/build.gradle.kts"))
          if not candidates:
              raise SystemExit("Start.io Android Gradle file not found in Pub cache")
          for gradle_file in candidates:
              content = gradle_file.read_text(encoding="utf-8")
              updated, count = re.subn(r"(compileSdkVersion\s+|compileSdk\s*=\s*)\d+", r"\g<1>36", content)
              if count == 0 and not re.search(r"compileSdkVersion\s+36|compileSdk\s*=\s*36", content):
                  raise SystemExit(f"Could not safely set compileSdk in {gradle_file}")
              if count:
                  gradle_file.write_text(updated, encoding="utf-8")
              print(f"Start.io library compileSdk set to 36: {gradle_file}")
          PY
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Present-Download-Manager-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Build Windows EXE package
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows project
        run: flutter create --platforms=windows .
      - name: Get dependencies
        run: flutter pub get
      - name: Build release
        run: flutter build windows --release
      - name: Package EXE and required runtime files
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Present-Download-Manager-Windows-x64.zip -Force
      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Present-Download-Manager-Windows-x64
          path: Present-Download-Manager-Windows-x64.zip
          if-no-files-found: error
